services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlasdocs
      POSTGRES_USER: atlasdocs
      POSTGRES_PASSWORD: atlasdocs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasdocs -d atlasdocs"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlasdocs_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: atlasdocs
      DATABASE_USER: atlasdocs
      DATABASE_PASSWORD: atlasdocs
      PAPERLESS_BASE_URL: http://host.docker.internal:8000
      # Browser-facing Paperless UI origin (optional). Do not point this at the
      # internal Docker hostname; use the URL users open in a browser.
      # PAPERLESS_PUBLIC_URL: http://localhost:8000
      ATLASDOCS_ENV: development
      SESSION_SECRET: dev-only-change-me
      TOKEN_ENCRYPTION_KEY: dev-only-token-encryption-key
      SESSION_SECURE: "false"
      SEED_PATH: /app/config/seed/v0.1.yaml
    volumes:
      - atlasdocs_ingest_spool:/tmp/atlasdocs-ingest
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["atlasdocs", "worker", "ingest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: atlasdocs
      DATABASE_USER: atlasdocs
      DATABASE_PASSWORD: atlasdocs
      PAPERLESS_BASE_URL: http://host.docker.internal:8000
      ATLASDOCS_ENV: development
      SESSION_SECRET: dev-only-change-me
      TOKEN_ENCRYPTION_KEY: dev-only-token-encryption-key
      SESSION_SECURE: "false"
    volumes:
      - atlasdocs_ingest_spool:/tmp/atlasdocs-ingest
    depends_on:
      db:
        condition: service_healthy

volumes:
  atlasdocs_pg:
  atlasdocs_ingest_spool:
