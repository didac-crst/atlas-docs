ontologies:
  - code: country
    name: Country
    concepts:
      - code: france
        name: France
      - code: germany
        name: Germany
      - code: spain
        name: Spain
  - code: document-type
    name: Document Type
    concepts:
      - code: payslip
        name: Payslip
      - code: invoice
        name: Invoice
  - code: person
    name: Person
    concepts:
      - code: alice
        name: Alice
      - code: bob
        name: Bob
  - code: organization
    name: Organization
    concepts:
      - code: acme
        name: Acme
      - code: contoso
        name: Contoso

relationship_types:
  - code: source-country
    name: Source Country
    target_ontology: country
    directionality: directed
  - code: document-type
    name: Document Type
    target_ontology: document-type
    directionality: directed
  - code: concerns
    name: Concerns
    # Any concept; resolved by name/code across ontologies.
    target_ontology: null
    directionality: directed
  - code: issued-by
    name: Issued By
    target_ontology: organization
    directionality: directed
  - code: concerns-person
    name: Concerns Person
    target_ontology: person
    directionality: directed
  - code: related-to
    name: Related To
    target_ontology: null
    directionality: symmetric
  - code: derived-from
    name: Derived From
    target_ontology: null
    directionality: directed
    inverse: has-derivative
  - code: has-derivative
    name: Has Derivative
    target_ontology: null
    directionality: directed
    inverse: derived-from
  - code: replies-to
    name: Replies To
    target_ontology: null
    directionality: directed
    inverse: answered-by
  - code: answered-by
    name: Answered By
    target_ontology: null
    directionality: directed
    inverse: replies-to
