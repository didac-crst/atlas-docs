[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasdocs"
version = "0.2.0"
description = "Semantic document layer on top of Paperless-ngx"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
atlasdocs-seed = "atlasdocs.db.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlasdocs = ["ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
