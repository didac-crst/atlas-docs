name: CI

# HTTPS smoke tests against live Paperless/Satlas stay manual and out of CI.
# This workflow verifies code and packaging only (no Postgres/Paperless/secrets).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config

      - name: Build Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: atlasdocs:ci
