name: CI

# HTTPS smoke tests against live Paperless/Satlas stay manual and out of CI.
# This workflow verifies code, migrations, packaging, frontend, docs checks, and (on main/tags) image publish.
# Image publish runs only after test + frontend + e2e + container + hygiene + docs succeed; failed CI never publishes.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace conflict markers (git diff --check)
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git diff --check origin/main...HEAD
          else
            git diff --check
          fi

      - name: Secret and token leak scan (tracked source)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.pdf|*.woff|*.woff2|*.ttf) continue ;;
              package-lock.json|frontend/package-lock.json) continue ;;
            esac
            if git grep -nI -E \
              '(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----)' \
              -- "$file" >/tmp/leak-hits.txt 2>/dev/null; then
              echo "::error file=$file::Possible secret material"
              cat /tmp/leak-hits.txt
              fail=1
            fi
            if git grep -nIi -E \
              '(api[_-]?key|client_secret|password|private_key)\s*[:=]\s*["'"'"'][^"'"'"']{20,}["'"'"']' \
              -- "$file" >/tmp/cred-hits.txt 2>/dev/null; then
              while IFS= read -r hit; do
                # Compare the quoted assignment value exactly — never substring-match the line.
                value=$(printf '%s\n' "$hit" | sed -nE 's/.*[:=][[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p')
                case "$value" in
                  test-token|test-secret|dev-only-change-me|e2e-session-secret|production-db-password|atlasdocs|dev-only-token-encryption-key|e2e-token-encryption-key|test-token-encryption-key|production-token-key|correct-horse)
                    continue
                    ;;
                esac
                echo "::error file=$file::Possible hardcoded credential assignment"
                echo "$hit"
                fail=1
              done < /tmp/cred-hits.txt
            fi
          done < <(git ls-files)
          exit "$fail"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlasdocs
          POSTGRES_PASSWORD: atlasdocs
          POSTGRES_DB: atlasdocs_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasdocs -d atlasdocs_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests including PostgreSQL migrations
        env:
          ATLASDOCS_TEST_DATABASE_URL: postgresql+psycopg://atlasdocs:atlasdocs@localhost:5432/atlasdocs_migration
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install, Vitest, and TypeScript/Vite build
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Mermaid syntax and internal Markdown links
        run: |
          npm install
          npm run check:docs

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package.json
            frontend/package.json

      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Build SPA into src/atlasdocs/ui/spa
        working-directory: frontend
        run: |
          npm install
          npm run build
          test -f ../src/atlasdocs/ui/spa/index.html

      - name: Install Playwright
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests (mocked Paperless)
        run: npx playwright test

  container:
    runs-on: ubuntu-latest
    needs: [test, frontend, hygiene, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config

      - name: Build Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: atlasdocs:ci

  publish:
    needs: [test, frontend, e2e, container, hygiene, docs]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlasdocs
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
